<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ya Olsaydı?</title>
<meta name="description" content="Ya Olsaydı? — tarihin, bilimin ve dünyanın alternatif senaryoları, kısa yapay zeka videolarıyla.">
<style>
  :root { --zemin: #0b0d12; --metin: #e9ecf2; --soluk: #9aa3b2; --vurgu: #ffd700; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: radial-gradient(circle at 50% 20%, #1b2436 0%, var(--zemin) 60%);
         color: var(--metin); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; text-align: center; }
  h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); margin: 0 0 12px; letter-spacing: -0.02em; }
  h1 span { color: var(--vurgu); }
  p { color: var(--soluk); line-height: 1.6; margin: 0 0 12px; }
  .baglantilar { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a { color: var(--metin); text-decoration: none; border: 1px solid #2c3446; padding: 10px 16px; border-radius: 999px; }
  a:hover { border-color: var(--vurgu); }
  footer { margin-top: 36px; font-size: 0.85rem; }
  footer a { border: 0; padding: 0; color: var(--soluk); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>Ya Olsaydı<span>?</span></h1>
  <p>Göktaşı hiç düşmeseydi? Buzullar aynı anda erise? Tarihin, bilimin ve dünyanın
     “ya olsaydı” hâllerini 30 saniyelik yapay zeka videolarıyla anlatıyoruz.</p>
  <p>Videolar kurgusal senaryolardır ve yapay zeka ile üretilir.</p>
  <div class="baglantilar">
    <a href="https://www.instagram.com/yaolsaydi_tv/">Instagram</a>
  </div>
  <footer><a href="gizlilik.html">Gizlilik Politikası</a></footer>
</main>
</body>
</html>
